name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday at 2 AM UTC

jobs:
  test-windows:
    name: 💻 Test on Windows
    runs-on: windows-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm ci --verbose
        shell: powershell
      
      - name: Lint Code
        run: npm run lint --if-present
        shell: powershell
        continue-on-error: true
      
      - name: Run Tests
        run: npm test --if-present
        shell: powershell
        continue-on-error: true
      
      - name: Build Project
        run: npm run build
        shell: powershell

  test-ubuntu:
    name: 💻 Test on Ubuntu
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm ci --verbose
      
      - name: Lint Code
        run: npm run lint --if-present
        continue-on-error: true
      
      - name: Run Tests
        run: npm test --if-present
        continue-on-error: true
      
      - name: Build Project
        run: npm run build

  code-quality:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Run Security Audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
