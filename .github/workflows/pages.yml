name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: ✅ Checkout
        uses: actions/checkout@v4

      - name: 🏗️ Build static site
        run: |
          # Create dist folder with all project files
          mkdir -p dist
          # Copy everything except what we don't need
          cp -r . dist/ || true
          # Clean up unnecessary folders from dist
          cd dist
          rm -rf .git .github node_modules dist 2>/dev/null || true
          # Verify index.html exists
          if [ ! -f "index.html" ]; then
            echo "❌ ERROR: index.html not found in dist/"
            ls -la
            exit 1
          fi
          echo "✅ Build complete. Files ready for deployment."
          echo "dist/ contents:"
          ls -la | head -20

      - name: 📦 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
